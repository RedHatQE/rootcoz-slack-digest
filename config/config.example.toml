# Copy to config.toml (gitignored) or mount as ConfigMap in-cluster.
# Secrets (credentials) come from K8s Secret; non-secret env (ROOTCOZ_URL, ROOTCOZ_VERIFY_SSL, SLACK_TARGETS) from ConfigMap.
# Message data is always loaded from the rootcoz API — no HTML report URLs.

[schedule]
# Keep deploy/cronjob.yaml spec.schedule in sync with this value.
# Note: schedule.cron is a sync marker for deploy/cronjob.yaml; timezone is unused (week window always UTC).
cron = "0 7 * * 0"
timezone = "UTC"

[digest]
max_rows = 25
sort_by = "not_reviewed" # not_reviewed | failures | job_name
tiers = ["gating", "release-checklist", "other"]
# Column order controls the Slack table (API fields only).
columns = ["job_name", "tier", "failures", "reviewed", "jenkins", "rootcoz"]
# Optional columns: team, not_reviewed, build
# Exclude jobs whose tags or metadata.labels contain these substrings.
# Example: exclude_tags = ["s390x"] filters out s390x architecture jobs.
exclude_tags = []
exclude_labels = []

[message]
format = "blocks" # blocks | mrkdwn | plain
include_mentions = true
# Placeholders: {week_label}, {mention_suffix}, {mention}
header_template = "*rootcoz weekly digest* — {week_label}{mention_suffix}"
# Placeholders: {total_jobs}, {total_failures}, {total_reviewed}, {week_label}
totals_template = "Jobs: *{total_jobs}* · Failures: *{total_failures}* · Reviewed: *{total_reviewed}*"
# row_template applies only when table_code_fence = false (list style).
# Placeholders: {job_name}, {tier}, {team}, {failures}, {reviewed}, {not_reviewed}, {build}, {jenkins_url}, {rootcoz_url}, {jenkins_link}, {rootcoz_link}, {jenkins_part}, {rootcoz_part}, {job_id}
row_template = "• *{job_name}* ({tier}) — fail {failures} / rev {reviewed}{jenkins_part}{rootcoz_part}"
# Placeholders: {omitted}
omitted_template = "_+{omitted} more jobs not shown (raise digest.max_rows)._"
table_code_fence = true

[rootcoz]
# Prefer env: ROOTCOZ_URL, ROOTCOZ_API_KEY, ROOTCOZ_VERIFY_SSL
url = ""
api_key = ""
verify_ssl = true
# API endpoint and default query params
endpoint = "/api/dashboard/filtered"

[rootcoz.params]
review_status = "not_reviewed"
limit = "0"

# Map logical field names → JSON dot-paths in the API response.
# Use dot notation for nested fields (e.g., "metadata.team").
# Use {placeholder} templates for constructed URLs.
[rootcoz.field_map]
job_id = "job_id"
job_name = "job_name"
team = "metadata.team"
tier = "metadata.labels"
failures = "failure_count"
reviewed = "reviewed_count"
build = "build_number"
jenkins = "jenkins_url"
rootcoz = "{url}/results/{job_id}"

# Map API label values → display tier names.
# When tier field is a list, first matching label wins.
# Unmatched values default to "other".
[rootcoz.tier_labels]
gating = "gating"
release-checklist = "release-checklist"

[slack]
# Prefer bot mode for usergroup mentions (<!subteam^ID>).
# Prefer env: SLACK_BOT_TOKEN, SLACK_WEBHOOK_URL
# Team → channel routing comes from SLACK_TARGETS env / ConfigMap (JSON):
#   [{"team": "virt-node", "channel": "C...", "usergroup": "virt-node-qe"}]
# Note: webhook mode supports at most one SLACK_TARGETS entry; use bot mode for multi-target routing.
mode = "bot"
bot_token = ""
webhook_url = ""
