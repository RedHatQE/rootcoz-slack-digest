# Copy to config.toml (gitignored) or mount as ConfigMap in-cluster.
# Secrets (credentials) come from K8s Secret; non-secret env (ROOTCOZ_URL, ROOTCOZ_VERIFY_SSL, TARGETS) from ConfigMap.
# Message data is always loaded from the rootcoz API — no HTML report URLs.

[schedule]
# Keep deploy/cronjob.yaml spec.schedule in sync with this value.
# Note: schedule.cron is a sync marker for deploy/cronjob.yaml; timezone is unused.
# Week window is always the last complete Sun–Sat in UTC.
cron = "0 7 * * 0"
timezone = "UTC"

[digest]
# 0 = no limit (show all jobs). Positive N truncates the Slack message.
max_rows = 0
sort_by = "not_reviewed" # not_reviewed | failures | job_name
# API labels to include. "other" is a display catch-all (not sent to API).
tiers = ["gating", "release-checklist", "other"]
# Column order controls the Slack table (API fields only).
columns = ["job_name", "tier", "failures", "reviewed", "jenkins", "rootcoz"]
# Optional columns: team, not_reviewed, build
# Passed as API ``exclude_label`` query params (metadata labels).
# Example: exclude_labels = ["s390x"]
exclude_labels = []
# Client-side only: exclude jobs whose name contains these substrings.
exclude_job_patterns = ["s390x"]

[message]
format = "blocks" # blocks | mrkdwn | plain
include_mentions = true
# Placeholders: {week_label}, {mention_suffix}, {mention}, {lanes}
header_template = "*rootcoz {lanes} weekly digest* — {week_label}{mention_suffix}"
# Placeholders: {total_jobs}, {total_failures}, {total_reviewed}, {week_label}
totals_template = "Jobs: *{total_jobs}* · Reviewed: *{total_reviewed}/{total_failures}*"
# row_template applies only for plain format when table_code_fence = false (list style).
# Placeholders: {job_name}, {tier}, {team}, {failures}, {reviewed}, {not_reviewed}, {build}, {jenkins_url}, {rootcoz_url}, {jenkins_link}, {rootcoz_link}, {jenkins_part}, {rootcoz_part}, {job_id}, {bundle}
row_template = "• *{job_name}* ({tier}) — fail {failures} / rev {reviewed}{jenkins_part}{rootcoz_part}"
# Placeholders: {omitted} (only used when digest.max_rows > 0)
omitted_template = "_+{omitted} more jobs not shown (raise digest.max_rows)._"
# table_code_fence only applies to plain format; blocks/mrkdwn use grouped-by-tier links.
table_code_fence = true
# Celebration when a target has no open failures. Placeholders:
# {week_label}, {mention_suffix}, {mention}, {team}, {total_jobs}, {lanes}
# celebration_reviewed_template = "🎉 *rootcoz {lanes} weekly digest* — {week_label}{mention_suffix}\n\n✅ All *{total_jobs}* {lanes} failures for *{team}* have been reviewed! 👏"
# celebration_no_failures_template = "🎉 *rootcoz {lanes} weekly digest* — {week_label}{mention_suffix}\n\n✅ Zero {lanes} failures for *{team}* this week! 🚀"
# Email subject. Placeholders: {lanes}, {week_label}, {team}
# email_subject_template = "rootcoz {lanes} weekly digest — {week_label} — {team}"

[rootcoz]
# Prefer env: ROOTCOZ_URL, ROOTCOZ_API_KEY, ROOTCOZ_VERIFY_SSL
url = ""
api_key = ""
verify_ssl = true
# API endpoint and default query params
endpoint = "/api/dashboard/filtered"

[rootcoz.params]
review_status = "not_reviewed"
limit = "0"

# Map logical field names → JSON dot-paths in the API response.
# Use dot notation for nested fields (e.g., "metadata.team").
# Use {placeholder} templates for constructed URLs.
[rootcoz.field_map]
job_id = "job_id"
job_name = "job_name"
team = "metadata.team"
version = "metadata.version"
tier = "metadata.labels"
failures = "failure_count"
reviewed = "reviewed_count"
build = "build_number"
jenkins = "jenkins_url"
rootcoz = "{url}/results/{job_id}"
tags = "tags"
# Regex matched against each tags[] entry to pick the bundle version string.
# bundle_pattern = "v\\d+\\.\\d+\\."

# Map API label values → display tier names.
# When tier field is a list, first matching label wins.
# Unmatched values default to default_tier.
[rootcoz.tier_labels]
gating = "gating"
release-checklist = "release-checklist"
# default_tier = "other"

[slack]
# Prefer bot mode for usergroup mentions (<!subteam^ID>).
# Prefer env: SLACK_BOT_TOKEN, SLACK_WEBHOOK_URL
# Team routing comes from TARGETS env / ConfigMap (JSON):
#   [{"team": "virt-node", "slack": {"channel": "C...", "usergroup": "virt-node-qe"},
#     "email": {"recipients": ["team@redhat.com"], "cc": []}}]
# Note: webhook mode supports at most one TARGETS entry with slack; use bot mode for multi-target routing.
mode = "bot"
bot_token = ""
webhook_url = ""

[email]
# SMTP relay (no auth). Enable to deliver digests via TARGETS[].email.
enabled = false
smtp_host = "smtp.example.com"
smtp_port = 25
from_address = "rootcoz-digest@redhat.com"
use_tls = false
