[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootcoz-slack-digest"
version = "0.1.0"
description = "Weekly Slack digest of rootcoz failures/reviews for CNV QE teams"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Red Hat QE" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
]

[project.scripts]
rootcoz-slack-digest = "rootcoz_slack_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcoz_slack_digest"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rootcoz_slack_digest --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "tox>=4.0",
    "tox-uv>=1.0",
    "mypy>=1.0",
]
