apiVersion: batch/v1
kind: CronJob
metadata:
  name: rootcoz-slack-digest
  namespace: REPLACE_NAMESPACE
  labels:
    app: rootcoz-slack-digest
spec:
  # Must match [schedule].cron in config / ConfigMap
  schedule: "0 7 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: rootcoz-slack-digest
        spec:
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: python:3.12-slim
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  export HOME=/tmp
                  # Private repo: Secret must include GITHUB_TOKEN (read access).
                  pip install --quiet --target=/tmp/pylibs \
                    "rootcoz-slack-digest @ git+https://x-access-token:${GITHUB_TOKEN}@github.com/REPLACE_ORG/rootcoz-slack-digest.git@${DIGEST_REPO_REF}"
                  PYTHONPATH=/tmp/pylibs PATH="/tmp/pylibs/bin:$PATH" \
                    python -m rootcoz_slack_digest run --config /config/config.toml
              env:
                - name: DIGEST_REPO_REF
                  value: main
                - name: ROOTCOZ_VERIFY_SSL
                  value: "false"
              envFrom:
                - secretRef:
                    name: rootcoz-slack-digest-credentials
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: rootcoz-slack-digest-config
