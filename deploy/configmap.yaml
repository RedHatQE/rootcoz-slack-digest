apiVersion: v1
kind: ConfigMap
metadata:
  name: rootcoz-slack-digest-config
  namespace: REPLACE_NAMESPACE
  labels:
    app: rootcoz-slack-digest
data:
  config.toml: |
    [schedule]
    cron = "0 7 * * 0"
    timezone = "UTC"

    [digest]
    max_rows = 25
    sort_by = "not_reviewed"
    tiers = ["gating", "release-checklist", "other"]
    columns = ["job_name", "tier", "failures", "reviewed", "jenkins", "rootcoz"]
    exclude_tags = ["s390x"]
    exclude_labels = []

    [message]
    format = "blocks"
    include_mentions = true
    header_template = "*rootcoz weekly digest* — {week_label}{mention_suffix}"
    totals_template = "Jobs: *{total_jobs}* · Failures: *{total_failures}* · Reviewed: *{total_reviewed}*"
    omitted_template = "_+{omitted} more jobs not shown (raise digest.max_rows)._"
    table_code_fence = true

    [rootcoz]
    endpoint = "/api/dashboard/filtered"

    [rootcoz.params]
    review_status = "not_reviewed"
    limit = "0"

    [rootcoz.field_map]
    job_id = "job_id"
    job_name = "job_name"
    team = "metadata.team"
    tier = "metadata.labels"
    failures = "failure_count"
    reviewed = "reviewed_count"
    build = "build_number"
    jenkins = "jenkins_url"
    rootcoz = "{url}/results/{job_id}"

    [rootcoz.tier_labels]
    gating = "gating"
    release-checklist = "release-checklist"

    [slack]
    mode = "bot"
  ROOTCOZ_URL: "REPLACE"
  ROOTCOZ_VERIFY_SSL: "true"
  SLACK_TARGETS: |
    [
      {"team": "virt-node", "channel": "REPLACE", "usergroup": "virt-node-qe"},
      {"team": "network", "channel": "REPLACE", "usergroup": "network-qe"}
    ]
