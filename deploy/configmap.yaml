apiVersion: v1
kind: ConfigMap
metadata:
  name: rootcoz-slack-digest-config
  namespace: REPLACE_NAMESPACE
  labels:
    app: rootcoz-slack-digest
data:
  config.toml: |
    [schedule]
    # Week window is always the last complete Sun–Sat in UTC.
    cron = "0 7 * * 0"
    timezone = "UTC"

    [digest]
    # 0 = no limit. tiers / exclude_labels are API query params; exclude_job_patterns is client-side name filter.
    max_rows = 0
    sort_by = "not_reviewed"
    tiers = ["gating", "release-checklist", "other"]
    columns = ["job_name", "tier", "failures", "reviewed", "jenkins", "rootcoz"]
    exclude_labels = ["s390x"]
    exclude_job_patterns = ["s390x"]

    [message]
    format = "blocks"
    include_mentions = true
    header_template = "*rootcoz {lanes} weekly digest* — {week_label}{mention_suffix}"
    totals_template = "Jobs: *{total_jobs}* · Reviewed: *{total_reviewed}/{total_failures}*"
    omitted_template = "_+{omitted} more jobs not shown (raise digest.max_rows)._"
    # table_code_fence only applies to plain format; blocks/mrkdwn use grouped-by-tier links.
    table_code_fence = true

    [rootcoz]
    endpoint = "/api/dashboard/filtered"

    [rootcoz.params]
    review_status = "not_reviewed"
    limit = "0"

    [rootcoz.field_map]
    job_id = "job_id"
    job_name = "job_name"
    team = "metadata.team"
    tier = "metadata.labels"
    failures = "failure_count"
    reviewed = "reviewed_count"
    build = "build_number"
    jenkins = "jenkins_url"
    rootcoz = "{url}/results/{job_id}"
    tags = "tags"

    [rootcoz.tier_labels]
    gating = "gating"
    release-checklist = "release-checklist"

    [slack]
    mode = "bot"

    [email]
    enabled = false
    smtp_host = "smtp.example.com"
    smtp_port = 25
    from_address = "rootcoz-digest@redhat.com"
    use_tls = false
  ROOTCOZ_URL: "REPLACE"
  ROOTCOZ_VERIFY_SSL: "true"
  TARGETS: |
    [
      {
        "team": "virt-node",
        "slack": {"channel": "REPLACE", "usergroup": "virt-node-qe"},
        "email": {"recipients": ["REPLACE@redhat.com"]}
      },
      {
        "team": "network",
        "slack": {"channel": "REPLACE", "usergroup": "network-qe"},
        "email": {"recipients": ["REPLACE@redhat.com"]}
      }
    ]
